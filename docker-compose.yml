name: foundry-tx-simulator

services:
  backend:
    platform: linux/amd64
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      TXSIM_CONFIG: /app/config.docker.yml
    ports:
      - "${TXSIM_BACKEND_PORT:-8080}:8080"
    volumes:
      - backend-runs:/data/runs
      - scratch-projects:/data/scratch-projects

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    environment:
      TXSIM_API_URL: "${TXSIM_API_URL:-http://127.0.0.1:${TXSIM_BACKEND_PORT:-8080}}"
    ports:
      - "${TXSIM_FRONTEND_PORT:-5173}:80"

volumes:
  backend-runs:
  scratch-projects:
